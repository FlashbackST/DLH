<body>
<header class="top"><div class="in"><a href="index.html" id="menuLink">☰ Menu</a><div class="t">Cyber Bingo</div></div></header>
<main id="app"></main>

<script>
/* ---------------- THE 16 SQUARES ---------------- */
const SQUARES = [
  // red flags (learning outcome 1)
  {id:"rush",   t:"flag",  x:"Rush: “do it now!”"},
  {id:"link",   t:"flag",  x:"Strange link"},
  {id:"code",   t:"flag",  x:"Asks for a code or password"},
  {id:"money",  t:"flag",  x:"Asks for money"},
  {id:"secret", t:"flag",  x:"“Keep it secret / don't call”"},
  // good habits (learning outcome 2)
  {id:"call",   t:"habit", x:"Call back on a number you know"},
  {id:"check",  t:"habit", x:"Check the sender and the link"},
  {id:"tell",   t:"habit", x:"Tell your contact person"},
  {id:"mfa",    t:"habit", x:"Turn on the phone check (MFA)"},
  {id:"pwm",    t:"habit", x:"Use a password manager"},
  {id:"share",  t:"habit", x:"Share only with named people"},
  {id:"copy",   t:"habit", x:"Keep a copy offline"},
  {id:"unplug", t:"habit", x:"Unplug the device"},
  // traps: the wrong reaction in each situation – players mark the trap they spot
  {id:"t_reply",   t:"trap", x:"Reply to ask if it's real"},
  {id:"t_approve", t:"trap", x:"Send the code back to help"},
  {id:"t_pay",     t:"trap", x:"Pay quickly to stay safe"},
  {id:"t_click",   t:"trap", x:"Click the link to see what it is"},
  {id:"t_forward", t:"trap", x:"Forward it to all colleagues"},
  {id:"t_onepw",   t:"trap", x:"One easy password for the whole team"},
  {id:"t_open",    t:"trap", x:"Share with a link anyone can open"},
  {id:"t_restart", t:"trap", x:"Ignore it and keep working"},
  // weak points (learning outcome 3) – found in situations 5, 6 and 7
  {id:"w1",     t:"weak",  x:"Fake messages"},
  {id:"w2",     t:"weak",  x:"Simple passwords, no phone check"},
  {id:"w3",     t:"weak",  x:"Sharing with anyone, no copy"}
];
const KIND = {flag:"Common attack", habit:"Good habit", trap:"Trap", weak:"Weak point (risk!)"};

/* ---------------- THE SITUATIONS (trainer screen) ---------------- */
const SITUATIONS = [
  {h:"WhatsApp from a new number", s:"“Hi Mum, I lost my phone, this is my new number. Please don't tell Dad – I'll explain later. Can you call me only on this number?”",
   a:["secret","call","t_reply"], w:"Secrecy cuts you off from people who could warn you. Call your child back on the number you already know.", t:"t_reply", tw:"Your reply goes straight to the scammer."},
  {h:"The prize draw", s:"Last week two volunteers clicked on an email: “Congratulations, you won our prize draw! Claim your prize here: win-prize-lux.top”",
   a:["link","w1","t_forward"], w:"A strange link in a message you didn't expect. Fake messages are the first weak point of every NGO.", t:"t_forward", tw:"Forwarding spreads the dangerous link to more people."},
  {h:"A code “sent by mistake”", s:"WhatsApp from a “volunteer”: “Oops, I sent you a 6-digit code by mistake – can you send it back to me?”",
   a:["code","mfa","t_approve"], w:"That code lets them take over your WhatsApp. Never share codes, and turn on the two-step check.", t:"t_approve", tw:"Sending the code gives them your WhatsApp account."},
  {h:"The youth club", s:"At the youth club, all volunteers use the same password “Club2026” for the club email and the Facebook page.",
   a:["pwm","w2","t_onepw"], w:"One shared, easy password opens everything – the second weak point. A password manager gives each account its own long password.", t:"t_onepw", tw:"One shared, easy password opens everything for an attacker."},
  {h:"A generous “donor”", s:"Facebook message: “I'd like to give €5,000 to your NGO! First please pay a €90 bank fee through this link.”",
   a:["money","check","t_pay"], w:"A gift that costs you money first is a scam. Check who is writing and where the link really goes.", t:"t_pay", tw:"Paying to receive money is always a scam."},
  {h:"The old volunteer", s:"A volunteer who left 8 months ago can still open the shared folder with all members' addresses.",
   a:["share","w3","t_open"], w:"Access should end when someone leaves – the third weak point is sharing with anyone. Share only with the people who need it.", t:"t_open", tw:"An open link can be forwarded to anyone – forever."},
  {h:"The full mailbox", s:"Email: “Your mailbox is full! Log in within 24 hours or all your emails will be deleted.”",
   a:["rush","tell","t_click"], w:"Rush makes you click without thinking. Don't react – show it to your contact person first.", t:"t_click", tw:"Clicking the link is exactly what the attacker wants."},
  {h:"The strange ZIP file", s:"After opening “Receipt.zip” from an unknown sender, the computer gets very slow and files suddenly have strange names.",
   a:["unplug","copy","t_restart"], w:"This looks like ransomware. Unplug it from the network to stop it spreading – and only an offline copy lets you get your files back.", t:"t_restart", tw:"While you keep working, ransomware keeps locking files and spreading."}
];

const $ = s => document.querySelector(s);
const label = id => SQUARES.find(q => q.id === id);
const store = { get(k,d){ try{ const v = localStorage.getItem("bingo_"+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
                set(k,v){ try{ localStorage.setItem("bingo_"+k, JSON.stringify(v)); }catch(e){} } };

/* ---------------- PARTICIPANT CARD (5 x 5, FREE in the middle) ---------------- */
const LINES = (() => { const L = [];
  for (let r = 0; r < 5; r++) L.push([0,1,2,3,4].map(c => r*5 + c));
  for (let c = 0; c < 5; c++) L.push([0,1,2,3,4].map(r => r*5 + c));
  L.push([0,6,12,18,24], [4,8,12,16,20]);
  L.push([0,4,20,24]);   // four corners
  return L; })();
// a card = 25 cells: 24 squares + "FREE" at index 12.
// Cards are reshuffled until no line can be completed before situation 5.
const FIRST_BINGO_FROM = 5;
function firstLineAt(a){ // situation number (1-8) at which this card gets its first line
  const m = new Set(["FREE"]);
  for (let k = 0; k < SITUATIONS.length; k++) {
    SITUATIONS[k].a.forEach(id => m.add(id));
    if (LINES.some(l => l.every(i => m.has(a[i])))) return k + 1;
  }
  return 99;
}
function makeCard(){
  let a;
  for (let tries = 0; tries < 10000; tries++) {
    a = SQUARES.map(q => q.id);
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    a.splice(12, 0, "FREE");
    if (firstLineAt(a) >= FIRST_BINGO_FROM) return a;
  }
  return a;
}
/* ---------------- START CODE (clock sync, no server) ----------------
   The trainer starts the game at the next full minute; the code is that minute (00-59).
   Every phone turns the code into the same moment, so all boards unlock together. */
const SEC = 45;   // 8 situations x 45 s = 6 minutes
function nextStartMinute(){ const t = new Date(Date.now() + 20000); t.setSeconds(0,0); t.setMinutes(t.getMinutes() + 1); return t.getTime(); }
function startFromCode(code){
  if (!/^\d{1,2}$/.test(code)) return null;
  const m = parseInt(code, 10); if (m > 59) return null;
  const now = Date.now(); let best = null;
  for (const dh of [-1, 0, 1]) { const t = new Date(now); t.setHours(t.getHours() + dh, m, 0, 0); const d = t.getTime() - now;
    if (d > -30*60000 && d <= 30*60000 && (best === null || Math.abs(d) < Math.abs(best - now))) best = t.getTime(); }
  return best;
}
const mmss = sec => `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;

/* ---------------- LIVE LOBBY (Netlify Function /api/bingo) ----------------
   Phones join with the 4-digit game code and a nickname, the trainer sees who joined
   and presses Start. Times are corrected with the server clock, so every screen agrees.
   If the server can't be reached, the 2-digit clock code above still works. */
const API = "/api/bingo";
async function api(body, qs){
  const t0 = Date.now();
  const r = await fetch(API + (qs || ""), body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : { cache: "no-store" });
  const t1 = Date.now(); const d = await r.json();
  if (d && d.now) window._offset = d.now - (t0 + t1) / 2;   // server clock minus phone clock
  return d;
}
const localTime = serverTime => serverTime - (window._offset || 0);
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
function myId(){ let id = store.get("bingoPid", null); if (!id) { id = Math.random().toString(36).slice(2, 12) + Date.now().toString(36); store.set("bingoPid", id); } return id; }

/* step 1: rules and winning patterns, then the card */
function renderIntro(){
  clearInterval(window._qTimer); clearInterval(window._gPoll);
  const old = store.get("bingoStart", null);   // forget a game that ended long ago
  if (old && Date.now() - old > (SITUATIONS.length * SEC + 600) * 1000) { store.set("bingoStart", null); store.set("bingoGame", null); store.set("picks5e", {}); }
  const pats = [["Row",[10,11,12,13,14]],["Column",[2,7,12,17,22]],["Diagonal",[0,6,12,18,24]],["4 corners",[0,4,20,24]]];
  $("#app").innerHTML = `
    <section class="intro">
      <h2>How to play</h2>
      <p>For each situation, find <b>3 squares</b> on your card:</p>
      <ul class="steps">
        <li><b style="color:var(--red)">Common attack</b> <span>or</span> <b style="color:var(--purple)">Weak point</b></li>
        <li><b style="color:var(--green)">Good habit</b> <span>that helps</span></li>
        <li><b style="color:#e07000">Trap</b> <span>the wrong reaction to avoid</span></li>
      </ul>
      <p class="muted">You have <b>3 picks per situation</b> – at most <b>one of each kind</b> (one common attack, one good habit, one weak point, one trap). Changed your mind? Tap your pick again. After 45 seconds the right squares turn <b style="color:#1e9e3e">green</b> – only green squares count for Bingo.</p>
    </section>
    <section class="intro">
      <h2>How to win</h2>
      <div class="rule"><b>FREE!</b><span>The middle square is free – use it freely in any line.</span></div>
      <div class="rule"><b>BINGO!</b><span>A full row, column, diagonal or the 4 corners. <b>The first Bingo wins!</b> The game continues.</span></div>
      <div class="rule"><b>FULL CARD</b><span>All squares marked. The game ends.</span></div>
    </section>
    <section class="intro">
      <h2>Winning patterns</h2>
      <div class="pats2">${pats.map(([n,c]) =>
        `<div class="pat2"><div class="pg2">${Array.from({length:25},(_,i)=>`<i class="${c.includes(i)?"on":""}">${i===12?"FREE":""}</i>`).join("")}</div><span>${n}</span></div>`).join("")}</div>
    </section>
    ${store.get("bingoStart", null) || store.get("bingoGame", null) ? `<button class="btn start" id="back">Back to the game →</button>` : `
    <section class="intro join">
      <h2>Join the game</h2>
      <p>Your <b>nickname</b> (no real name needed):</p>
      <input id="nick" class="nick" maxlength="20" placeholder="e.g. Blue Owl" autocomplete="off" value="${esc(store.get("bingoName", ""))}">
      <p>The <b>game code</b> shown on the screen:</p>
      <input id="code" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off">
      <p class="err" id="err"></p>
      <button class="btn start" id="join">Join →</button>
    </section>`}`;
  const back = $("#back"); if (back) back.onclick = () => { (store.get("bingoStart", null) ? renderCard : renderLobby)(); window.scrollTo(0,0); };
  const join = $("#join");
  if (join) join.onclick = async () => {
    const code = $("#code").value.trim(), name = $("#nick").value.trim();
    const err = m => { $("#err").textContent = m; };
    if (/^\d{1,2}$/.test(code)) {            // offline fallback: 2-digit clock code
      const st = startFromCode(code);
      if (st === null || Date.now() - st > SITUATIONS.length * SEC * 1000) return err("This code doesn't work – check the screen.");
      store.set("bingoStart", st); store.set("bingoStarted", true); renderCard(); window.scrollTo(0,0); return;
    }
    if (!name) return err("Please type a nickname.");
    if (!/^\d{4}$/.test(code)) return err("Please type the 4-digit game code from the screen.");
    join.disabled = true; join.textContent = "Joining…";
    try {
      const d = await api({ action: "join", code, name, pid: myId() });
      if (!d.ok) { join.disabled = false; join.textContent = "Join →"; return err(d.error === "no-game" ? "This game code doesn't exist – check the screen." : "Please check your nickname and try again."); }
      store.set("bingoName", name); store.set("bingoGame", code); store.set("bingoStarted", true);
      if (d.startAt) { store.set("bingoStart", localTime(d.startAt)); renderCard(); } else renderLobby();
      window.scrollTo(0,0);
    } catch (e) { join.disabled = false; join.textContent = "Join →"; err("No connection – check your internet and try again."); }
  };
}


/* while playing: if the trainer stops the game, every phone stops too */
function stoppedByTrainer(){
  clearInterval(window._qTimer); clearInterval(window._gPoll);
  ["bingoStart","bingoGame"].forEach(k => store.set(k, null)); store.set("bingoStarted", false);
  store.set("picks5e", {}); store.set("order5e", null);          // next game = fresh card
  renderIntro(); window.scrollTo(0,0);
  const e = document.getElementById("err"); if (e) e.textContent = "The trainer stopped the game. Type the new code to join the next one.";
}
function watchGame(){
  clearInterval(window._gPoll);
  const code = store.get("bingoGame", null); if (!code) return;
  window._gPoll = setInterval(async () => {
    try { const d = await api(null, "?code=" + code); if (d && d.ok === false && d.error === "no-game") stoppedByTrainer(); } catch (e) {}  // no internet: keep playing
  }, 4000);
}
/* waiting room on the phone: until the trainer presses Start */
function renderLobby(){
  clearInterval(window._qTimer); clearInterval(window._gPoll);
  const code = store.get("bingoGame", null); if (!code) { renderIntro(); return; }
  $("#app").innerHTML = `<div class="wait"><div class="wt">You're in, ${esc(store.get("bingoName", ""))}!</div>
      <div class="wc small">⏳</div><p>Waiting for the trainer to start the game.<br><b id="cnt">…</b></p></div>
    <div class="bar"><button class="btn" id="rules">Show me the rules</button></div>`;
  $("#rules").onclick = () => { renderIntro(); window.scrollTo(0,0); };
  const poll = async () => {
    try {
      const d = await api(null, "?code=" + code);
      if (!d.ok && d.error === "no-game") { stoppedByTrainer(); return; }
      if (d.startAt) { clearInterval(window._qTimer); store.set("bingoStart", localTime(d.startAt)); renderCard(); return; }
      const c = document.getElementById("cnt"); if (c) c.textContent = d.count === 1 ? "1 player has joined." : `${d.count} players have joined.`;
    } catch (e) { const c = document.getElementById("cnt"); if (c) c.textContent = "Reconnecting…"; }
  };
  poll(); window._qTimer = setInterval(poll, 2000);
}
function renderCard(){
  const st = store.get("bingoStart", null);
  if (!st) { (store.get("bingoGame", null) ? renderLobby : renderIntro)(); return; }
  if (Date.now() < st) {   // board locked until the trainer's start
    clearInterval(window._qTimer);
    $("#app").innerHTML = `<div class="wait"><div class="wt">The game starts in</div><div class="wc" id="wc"></div><p>Your bingo card appears automatically.<br>Get ready to find 3 squares per situation!</p></div>
      <div class="bar"><button class="btn" id="rules">Show me the rules</button></div>`;
    $("#rules").onclick = () => { renderIntro(); window.scrollTo(0,0); };
    const w = () => { const left = Math.ceil((st - Date.now()) / 1000); if (left <= 0) { clearInterval(window._qTimer); renderCard(); return; } const el = document.getElementById("wc"); if (el) el.textContent = mmss(left); };
    w(); window._qTimer = setInterval(w, 250); watchGame(); return;
  }
  try{ const d = JSON.parse(localStorage.getItem("ngo1_done") || "{}"); d.bingo = true; localStorage.setItem("ngo1_done", JSON.stringify(d)); }catch(e){}
  let order = store.get("order5e", null); if (!order || order.length !== 25) { order = makeCard(); store.set("order5e", order); }
  // picks per situation: { "0": [ids], "1": [ids], ... } – max 3 per situation
  let picks = store.get("picks5e", {});
  const PICKS = 3;
  const KIND_NAME = { flag: "common attack", habit: "good habit", weak: "weak point", trap: "trap" };
  const curIdx = () => Math.floor((Date.now() - store.get("bingoStart", Date.now())) / 1000 / SEC);
  // a pick turns green (confirmed) once its minute is over and it was one of the 3 right squares
  const greens = (cur) => { const g = new Set(); for (let k = 0; k < Math.min(cur, SITUATIONS.length); k++) (picks[k] || []).forEach(id => { if (SITUATIONS[k].a.includes(id)) g.add(id); }); return g; };
  let lastCur = -1, flash = null;
  const draw = () => {
    const cur = curIdx(), g = greens(cur), mine = cur < SITUATIONS.length ? (picks[cur] || []) : [];
    const wrong = new Set(flash && Date.now() < flash.until ? flash.ids : []);
    const isOn = i => order[i] === "FREE" || g.has(order[i]);
    const wins = LINES.filter(l => l.every(isOn));
    const winCells = new Set(wins.flat());
    const full = order.every((id, i) => isOn(i));
    $("#app").innerHTML = `
      <div class="qbox" id="qbox"></div>
      <div class="banner ${full ? "b2 show" : wins.length ? "b1 show" : ""}">${full ? "🏆 FULL CARD! The game ends." : wins.length >= 2 ? "🎉 DOUBLE BINGO!" : wins.length ? "🎉 BINGO! Shout it out – keep playing!" : ""}</div>
      <div class="grid g5">${"BINGO".split("").map(l => `<div class="letter">${l}</div>`).join("")}
      ${order.map((id, i) => { if (id === "FREE") return `<div class="cell free ${winCells.has(i) ? "win" : ""}">FREE!</div>`;
        const q = label(id), state = g.has(id) ? "ok" : mine.includes(id) ? "on" : wrong.has(id) ? "bad" : "";
        return `<button class="cell ${q.t} ${state} ${winCells.has(i) ? "win" : ""}" data-id="${id}"><span class="k">${KIND[q.t]}</span>${q.x}</button>`; }).join("")}</div>
      <div class="legend"><span><b style="color:var(--red)">Common attack</b> = what the attacker does</span><span><b style="color:var(--green)">Good habit</b> = what you do</span><span><b style="color:#e07000">Trap</b> = the wrong reaction – mark it when you spot it</span><span><b style="color:var(--purple)">Weak point (risk!)</b> = the risk behind the situation</span></div>
      <div class="bar"><button class="btn" id="rules">Show me the rules</button><a class="btn" href="checklist.html" style="text-decoration:none;background:var(--navy);color:#fff;border-color:var(--navy)">Questions &amp; checklist →</a></div>
      <footer>Your card stays on your phone only. All names and organisations in the game are fictional.</footer>`;
    $("#rules").onclick = e => { e.preventDefault(); renderIntro(); window.scrollTo(0,0); };
    document.querySelectorAll("button.cell").forEach(c => c.onclick = () => {
      const id = c.dataset.id, k = curIdx();
      if (k >= SITUATIONS.length) return;                       // game over: card is final
      if (g.has(id)) return note("This square is already confirmed ✓");
      let list = picks[k] || [];
      const kind = label(id).t, same = list.find(x => label(x).t === kind);
      if (list.includes(id)) list = list.filter(x => x !== id);  // tap again = undo
      else if (same) { list = list.map(x => x === same ? id : x); window._pendingNote = `Only one ${KIND_NAME[kind]} per situation – your pick was moved.`; }  // one per kind: swap
      else if (list.length >= PICKS) return note("Only 3 picks per situation – tap one of your picks to change it.");
      else list = [...list, id];
      picks[k] = list; store.set("picks5e", picks); const msg = window._pendingNote; draw(); if (window._qTick) window._qTick(true); if (msg) { window._pendingNote = null; note(msg); }
    });
  };
  const note = (m) => { const n = document.getElementById("qnote"); if (n) { n.textContent = m; n.classList.add("show"); clearTimeout(window._noteT); window._noteT = setTimeout(() => n.classList.remove("show"), 2500); } };
  draw();
  // one situation per minute; when a minute ends, the right picks turn green and wrong ones flash red
  const tick = (force) => {
    const t = Math.floor((Date.now() - store.get("bingoStart", Date.now())) / 1000);
    const i = Math.floor(t / SEC), left = SEC - (t % SEC);
    if (lastCur !== -1 && i !== lastCur) {                       // a minute just ended -> validate
      const k = lastCur, mine = picks[k] || [], right = mine.filter(id => SITUATIONS[k].a.includes(id));
      flash = { ids: mine.filter(id => !SITUATIONS[k].a.includes(id)), until: Date.now() + 4000, k, right: right.length, picked: mine.length };
      lastCur = i; draw(); setTimeout(() => { if (document.getElementById("qbox")) { draw(); window._qTick && window._qTick(true); } }, 4100);
    }
    if (lastCur === -1) lastCur = i;
    const box = document.getElementById("qbox"); if (!box) return;
    const result = flash && Date.now() < flash.until + 20000
      ? `<div class="qres">Situation ${flash.k + 1}: <b>${flash.right} of 3</b> right${flash.right === 3 ? " 🎉" : ""}</div>` : "";
    if (i >= SITUATIONS.length) {
      if (box.dataset.i !== "end" || force) { box.dataset.i = "end"; box.innerHTML = `${result}<div class="qdone">All ${SITUATIONS.length} situations done – check your card!</div>`; }
      return;
    }
    const sit = SITUATIONS[i], n = (picks[i] || []).length;
    if (box.dataset.i !== String(i) || force || box.dataset.r !== String(!!result)) {
      box.dataset.i = i; box.dataset.r = String(!!result);
      box.innerHTML = `${result}<div class="qtop"><span>Situation ${i + 1} of ${SITUATIONS.length}</span><span class="qsec" id="qsec"></span></div>
        <div class="qh">${sit.h}</div><div class="qs">${sit.s}</div>
        <div class="qpicks">Your picks: ${[0,1,2].map(j => `<i class="${j < n ? "on" : ""}"></i>`).join("")} <span>${n}/3</span></div>
        <div class="qnote" id="qnote"></div><div class="qbar"><i id="qfill"></i></div>`;
    }
    document.getElementById("qsec").textContent = `⏱ ${mmss(left)}`;
    document.getElementById("qfill").style.width = (left / SEC * 100) + "%";
    document.getElementById("qsec").classList.toggle("low", left <= 10);
  };
  window._qTick = tick; clearInterval(window._qTimer); tick(); window._qTimer = setInterval(tick, 250);
  watchGame();
}

/* ---------------- TRAINER SCREEN (#trainer) ---------------- */
function renderTrainer(){
  const ml = document.getElementById("menuLink"); if (ml) ml.style.display = "none";
  $("#app").classList.add("tr"); clearInterval(window._tTimer);
  const game = store.get("trainerGame", null), st = store.get("trainerStart", null);
  const reset = async () => {
    clearInterval(window._tTimer);
    if (game && !game.offline) { try { await api({ action: "reset", code: game.code, tk: game.tk }); } catch (e) {} }
    store.set("trainerGame", null); store.set("trainerStart", null); renderTrainer();
  };
  if (st && Date.now() - st > (SITUATIONS.length * SEC + 600) * 1000) { store.set("trainerGame", null); store.set("trainerStart", null); return renderTrainer(); }

  if (!game) {   // 1) ready screen
    $("#app").innerHTML = `<div class="sit"><div class="n">Cyber Bingo · trainer</div><h2>Ready?</h2>
      <div class="txt">Open the game: a game code appears. Everyone types it on the bingo page with a nickname, and you see who has joined. Start when everybody is in.</div>
      <p class="err" id="terr"></p>
      <div class="tbar"><button class="tbtn" id="open">Open the game</button></div></div>`;
    $("#open").onclick = async () => {
      $("#open").disabled = true; $("#open").textContent = "Opening…";
      try { const d = await api({ action: "create" }); if (!d.ok) throw 0;
        store.set("trainerGame", { code: d.code, tk: d.tk }); renderTrainer();
      } catch (e) {
        $("#terr").innerHTML = "The live game server can't be reached (no internet, or the site is opened from a file). You can still play with a <b>2-digit clock code</b> – the game then starts at the next full minute.";
        $("#open").outerHTML = `<button class="tbtn" id="offline">Use a clock code</button>`;
        $("#offline").onclick = () => { const t = nextStartMinute(); store.set("trainerGame", { code: String(new Date(t).getMinutes()).padStart(2, "0"), offline: true }); store.set("trainerStart", t); renderTrainer(); };
      }
    };
    return;
  }

  if (!st) {   // 2) lobby: who has joined?
    $("#app").innerHTML = `<div class="sit center"><div class="n">Type this game code on your phone</div><div class="code">${game.code}</div>
      <div class="txt"><b id="pc">0 players</b> have joined</div>
      <div class="plist" id="pl"></div>
      <div class="tbar mid"><button class="tbtn" id="go" disabled>Start the game</button><button class="tbtn ghost" id="cancel">Cancel</button></div>
      <p class="hint">Online participants: type the code in the Teams chat too.</p></div>`;
    $("#cancel").onclick = reset;
    $("#go").onclick = async () => {
      $("#go").disabled = true; $("#go").textContent = "Starting…";
      try { const d = await api({ action: "start", code: game.code, tk: game.tk }); if (!d.ok) throw 0;
        clearInterval(window._tTimer); store.set("trainerStart", localTime(d.startAt)); renderTrainer();
      } catch (e) { $("#go").disabled = false; $("#go").textContent = "Start the game"; alert("Could not start – check the internet connection and try again."); }
    };
    const poll = async () => {
      try {
        const d = await api(null, `?code=${game.code}&tk=${game.tk}`);
        if (!d.ok) { clearInterval(window._tTimer); store.set("trainerGame", null); return renderTrainer(); }
        const names = d.players || [];
        $("#pc").textContent = names.length === 1 ? "1 player" : `${names.length} players`;
        $("#pl").innerHTML = names.map(n => `<span>${esc(n)}</span>`).join("");
        const go = $("#go"); if (go && go.textContent === "Start the game") go.disabled = names.length === 0;
      } catch (e) { $("#pc").textContent = "Reconnecting…"; }
    };
    poll(); window._tTimer = setInterval(poll, 2000);
    return;
  }

  // 3) the game: one situation per minute, in step with the phones
  const code = game.code;
  let shown = -1, ansOpen = false;
  const tick = () => {
    const t = Math.floor((Date.now() - st) / 1000);
    if (t < 0) {
      if (shown !== -2) { shown = -2;
        $("#app").innerHTML = `<div class="sit center"><div class="n">${game.offline ? "Type this start code on your phone" : "Get ready!"}</div><div class="code">${game.offline ? code : "🎯"}</div>
          <div class="txt">The game starts in <b id="tw"></b> – all bingo cards unlock at the same time.</div>
          <div class="tbar mid"><button class="tbtn ghost" id="reset">Cancel</button></div></div>`;
        $("#reset").onclick = reset; }
      $("#tw").textContent = mmss(-t); return;
    }
    const i = Math.floor(t / SEC), left = SEC - (t % SEC);
    if (i >= SITUATIONS.length) {
      if (shown !== 99) { shown = 99;
        $("#app").innerHTML = `<div class="sit center"><h2>All ${SITUATIONS.length} situations done!</h2><div class="txt">Who has a <b>FULL CARD</b>? Check it – the game ends.</div>
          <div class="tbar mid"><button class="tbtn ghost" id="reset">New game</button></div></div>`;
        $("#reset").onclick = reset; }
      return;
    }
    if (shown !== i) { shown = i; ansOpen = false;
      const s = SITUATIONS[i];
      $("#app").innerHTML = `
      <div class="sit">
        <div class="thead"><div class="n">Situation ${i+1} of ${SITUATIONS.length} · find 3 squares</div><span class="tcode">game ${code}</span><span class="tt" id="tt"></span></div>
        <div class="qbar big"><i id="tf"></i></div>
        <h2>${s.h}</h2>
        <div class="txt">${s.s}</div>
        <div class="ans" id="ans"><div>${s.a.map(id => `<span class="chip ${label(id).t}">${label(id).x}</span>`).join("")}</div><p>${s.w}</p>
          ${s.t ? `<p><b style="color:#e07000">The trap:</b> ${label(s.t).x} (${s.tw.replace(/\.$/, "")})</p>` : ""}</div>
        <div class="tbar"><button class="tbtn" id="show">Show the answer</button><button class="tbtn ghost" id="reset">Stop the game</button></div>
      </div>
      <footer>Trainer screen · The next situation appears automatically after 45 seconds, on the screen and on every phone. Check a “Bingo!” line before you accept it.</footer>`;
      $("#show").onclick = () => { ansOpen = true; $("#ans").classList.add("show"); };
      $("#reset").onclick = () => { if (confirm("Stop the game for everyone?")) reset(); };
    }
    $("#tt").textContent = "⏱ " + mmss(left); $("#tt").classList.toggle("low", left <= 10);
    $("#tf").style.width = (left / SEC * 100) + "%";
    if (left <= 12 && !ansOpen) { ansOpen = true; $("#ans").classList.add("show"); }   // answer shows by itself for the last 12 s
  };
  tick(); window._tTimer = setInterval(tick, 250);
}

function route(){ $("#app").classList.remove("tr"); (location.hash === "#trainer" ? renderTrainer : (store.get("bingoStart", null) ? renderCard : (store.get("bingoGame", null) ? renderLobby : renderIntro)))(); }
window.addEventListener("hashchange", route);
route();
</script>
</body>
